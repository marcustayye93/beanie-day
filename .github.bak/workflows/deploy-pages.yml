name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Keep the static app only — Actions metadata is fine to omit from public site
          # but the official action uploads the whole path; exclude via .gitignore is not enough.
          # We upload the whole repo root; .github is harmless if served.

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
