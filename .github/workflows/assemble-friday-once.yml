name: assemble-friday-once
on:
  workflow_dispatch:
  push:
    branches: [chore/friday-zone-pass-2026-10-02]
    paths:
      - 'data/research/friday-2026-10-02/**'
      - 'scripts/roll-friday-2026-10-02.py'
      - '.github/workflows/assemble-friday-once.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/friday-zone-pass-2026-10-02
      - name: Roll week.json for 2–8 Oct 2026
        run: python3 scripts/roll-friday-2026-10-02.py
      - name: Commit week.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/week.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(week): Friday zone-pass 2–8 Oct 2026"
          git push
